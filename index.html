<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisian YouTube 🇹🇳</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    :root{
        --bg:#0f0f0f;--surface:#181818;--surface2:#222;--surface3:#2a2a2a;
        --border:#333;--text:#fff;--text2:#aaa;--text3:#666;
        --accent:#3ea6ff;--red:#ff0000;--green:#0a0;--yellow:#fa0;
        --radius:12px;--radius-sm:8px;--radius-full:50px;
        --header-h:56px;--sidebar-w:240px;
        --font:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
    button{font-family:var(--font);cursor:pointer}
    input,textarea{font-family:var(--font)}

    /* ====== HEADER ====== */
    .hdr{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);z-index:1000;gap:12px}
    .hdr-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
    .menu-i{font-size:20px;color:var(--text);cursor:pointer;padding:6px}
    .logo-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
    .logo-img{height:32px;border-radius:6px}
    .logo-t{font-size:17px;font-weight:900;letter-spacing:-0.5px}
    .logo-r{color:var(--red)}
    .search-wrap{flex:1;max-width:520px;display:flex;margin:0 auto}
    .search-wrap input{flex:1;padding:8px 16px;border-radius:var(--radius-full) 0 0 var(--radius-full);border:1px solid var(--border);border-right:none;background:var(--surface);color:var(--text);font-size:14px;outline:none}
    .search-wrap input:focus{border-color:var(--accent)}
    .search-btn{padding:0 18px;border-radius:0 var(--radius-full) var(--radius-full) 0;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:16px}
    .hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .icon-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:none;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;transition:0.2s}
    .icon-btn:hover{background:var(--surface2);color:var(--text)}
    .badge-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;font-weight:700}
    .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .auth-cta{padding:7px 16px;border-radius:var(--radius-full);border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
    .auth-cta:hover{background:rgba(62,166,255,0.1)}

    /* ====== DROPDOWN MENU ====== */
    .dropdown{position:absolute;top:50px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:280px;z-index:2000;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
    .dropdown.show{display:block}
    .dd-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .dd-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;overflow:hidden;flex-shrink:0}
    .dd-avatar img{width:100%;height:100%;object-fit:cover}
    .dd-info{flex:1}
    .dd-name{font-size:14px;font-weight:600}
    .dd-email{font-size:12px;color:var(--text2)}
    .dd-item{padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text);transition:0.2s;cursor:pointer}
    .dd-item:hover{background:var(--surface2)}
    .dd-item i{width:20px;text-align:center;color:var(--text2)}
    .dd-sep{height:1px;background:var(--border);margin:4px 0}
    .dd-item.danger{color:#f44}
    .dd-item.danger i{color:#f44}

    /* ====== OVERLAY GENERIC ====== */
    .ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:3000;justify-content:center;align-items:flex-start;padding-top:60px;overflow-y:auto}
    .ov.active{display:flex}
    .ov-box{background:var(--surface);border-radius:var(--radius);width:92%;max-width:480px;margin-bottom:40px;overflow:hidden}
    .ov-box.lg{max-width:860px}
    .ov-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .ov-head h2{font-size:18px;font-weight:700}
    .ov-close{background:none;border:none;color:var(--text2);font-size:20px}
    .ov-body{padding:20px}

    /* ====== FORM ELEMENTS ====== */
    .form-group{margin-bottom:16px}
    .form-label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500}
    .form-input{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border 0.2s}
    .form-input:focus{border-color:var(--accent)}
    .form-textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;resize:vertical;min-height:80px}
    .form-btn{width:100%;padding:11px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:0.2s}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:#2b8fd9}
    .btn-danger{background:#f44;color:#fff}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-outline:hover{background:var(--surface2)}
    .form-error{color:#f44;font-size:12px;margin-top:4px}
    .form-switch{color:var(--accent);font-size:13px;text-align:center;margin-top:12px;cursor:pointer}
    .form-divider{text-align:center;color:var(--text3);font-size:12px;margin:16px 0;position:relative}
    .form-divider::before,.form-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
    .form-divider::before{left:0}
    .form-divider::after{right:0}
    .avatar-upload{width:80px;height:80px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 auto 16px;overflow:hidden;border:2px dashed var(--border);position:relative}
    .avatar-upload img{width:100%;height:100%;object-fit:cover}
    .avatar-upload i{font-size:24px;color:var(--text3)}
    .avatar-upload input{position:absolute;width:100%;height:100%;opacity:0;cursor:pointer}

    /* ====== SETTINGS PAGE ====== */
    .settings-nav{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
    .settings-tab{padding:12px 20px;font-size:14px;font-weight:500;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;transition:0.2s}
    .settings-tab:hover{color:var(--text)}
    .settings-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .settings-page{display:none;padding:20px}
    .settings-page.active{display:block}
    .setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
    .setting-info{flex:1}
    .setting-title{font-size:14px;font-weight:500}
    .setting-desc{font-size:12px;color:var(--text3);margin-top:2px}
    .toggle{width:44px;height:24px;border-radius:12px;background:var(--surface3);position:relative;cursor:pointer;transition:0.3s;flex-shrink:0}
    .toggle.on{background:var(--accent)}
    .toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:0.3s}
    .toggle.on::after{left:22px}
    .select-wrap{position:relative}
    .form-select{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;appearance:none;cursor:pointer}

    /* ====== SIDEBAR ====== */
    .side{position:fixed;top:var(--header-h);left:0;width:var(--sidebar-w);height:calc(100vh - var(--header-h));background:var(--bg);border-right:1px solid var(--border);overflow-y:auto;padding:8px;z-index:999;transition:transform 0.3s}
    .side.hidden{transform:translateX(-100%)}
    .side h4{font-size:12px;color:var(--text3);padding:12px 12px 6px;text-transform:uppercase;letter-spacing:1px}
    .side-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 12px;background:transparent;border:none;color:var(--text);font-size:13px;border-radius:var(--radius-sm);margin-bottom:1px;transition:0.15s}
    .side-btn:hover,.side-btn.active{background:var(--surface2);font-weight:600}
    .side-cnt{background:var(--surface2);padding:2px 7px;border-radius:10px;font-size:11px;color:var(--text3)}

    /* ====== MAIN ====== */
    .main{margin-left:var(--sidebar-w);margin-top:var(--header-h);padding:16px 20px;min-height:calc(100vh - var(--header-h))}

    /* ====== FILTER BAR ====== */
    .filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;align-items:center}
    .filter-bar::-webkit-scrollbar{display:none}
    .f-chip{padding:7px 16px;border-radius:var(--radius-sm);border:none;background:var(--surface2);color:var(--text);font-size:13px;white-space:nowrap;transition:0.2s}
    .f-chip:hover{background:var(--surface3)}
    .f-chip.active{background:var(--text);color:var(--bg);font-weight:600}
    .filter-advanced{padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px}
    .filter-advanced:hover{background:var(--surface2)}

    /* ====== GRID ====== */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:4px}
    .card{border-radius:var(--radius);overflow:hidden;transition:transform 0.2s;cursor:pointer}
    .card:hover{transform:translateY(-4px)}
    .card-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--surface2)}
    .card-thumb img{width:100%;height:100%;object-fit:cover;transition:0.3s}
    .card:hover .card-thumb img{transform:scale(1.05)}
    .card-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.8);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
    .card-body{padding:12px}
    .card-title{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
    .card-ch{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
    .card-cat{font-size:11px;color:var(--accent);margin-top:4px}

    /* ====== VIDEO PLAYER MODAL ====== */
    .v-player{width:100%;aspect-ratio:16/9;background:#000}
    .v-player iframe{width:100%;height:100%;border:none}
    .v-details{padding:16px 20px}
    .v-title{font-size:17px;font-weight:700;margin-bottom:4px}
    .v-ch{color:var(--text2);font-size:13px}
    .v-actions{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
    .v-act{background:var(--surface2);border:none;color:var(--text);padding:8px 16px;border-radius:var(--radius-full);font-size:13px;display:flex;align-items:center;gap:6px;transition:0.2s;text-decoration:none}
    .v-act:hover{background:var(--surface3)}
