    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #0f0f0f; color: #fff; direction: ltr; }
        
        /* HEADER */
        .header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #0f0f0f; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #272727; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 16px; cursor: pointer; }
        .logo-icon { color: #ff0000; font-size: 26px; }
        .logo-text { font-size: 19px; font-weight: 900; }
        .logo-yt { color: #ff0000; }
        .search-bar { flex: 1; max-width: 550px; margin: 0 20px; }
        .search-bar input { width: 100%; padding: 8px 16px; border-radius: 20px; border: 1px solid #303030; background: #121212; color: #fff; font-size: 14px; outline: none; }
        .search-bar input:focus { border-color: #3ea6ff; }
        .video-count { background: #ff0000; color: #fff; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        
        /* SIDEBAR */
        .sidebar { position: fixed; top: 56px; left: 0; width: 230px; height: calc(100vh - 56px); background: #0f0f0f; border-right: 1px solid #272727; overflow-y: auto; padding: 12px; }
        .sidebar h3 { font-size: 13px; color: #888; margin: 12px 0 6px 8px; }
        .sidebar-btn { display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; background: transparent; border: none; color: #fff; font-size: 13px; cursor: pointer; border-radius: 8px; margin-bottom: 2px; }
        .sidebar-btn:hover, .sidebar-btn.active { background: #272727; font-weight: bold; }
        .cat-count { background: #222; padding: 1px 6px; border-radius: 8px; font-size: 11px; color: #aaa; }
        
        /* MAIN */
        .main-content { margin-left: 230px; margin-top: 56px; padding: 16px 20px; }
        .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .chip { padding: 6px 14px; border-radius: 8px; border: none; background: #272727; color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .chip.active { background: #fff; color: #000; font-weight: bold; }
        
        /* GRID */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 10px; }
        .video-card { cursor: pointer; border-radius: 10px; overflow: hidden; transition: transform 0.2s; background: #181818; }
        .video-card:hover { transform: scale(1.02); }
        .video-thumb { position: relative; width: 100%; aspect-ratio: 16/9; }
        .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .topic-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #3ea6ff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .video-info { padding: 10px; }
        .video-title { font-size: 13px; font-weight: bold; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
        .video-channel { font-size: 12px; color: #aaa; }
        
        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-box { width: 90%; max-width: 850px; background: #181818; border-radius: 12px; overflow: hidden; position: relative; }
        .modal-close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; }
        .player { width: 100%; aspect-ratio: 16/9; }
        .player iframe { width: 100%; height: 100%; border: none; }
        .modal-text { padding: 16px; }
    </style>
</head>

        let currentCat = null, currentSub = null, searchQ = "";

        function init() {
            buildSidebar();
            buildChips();
            render(ALL_VIDEOS);
        }

        function buildSidebar() {
            const cats = {}, subs = {};
            ALL_VIDEOS.forEach(v => {
                cats[v.category] = (cats[v.category] || 0) + 1;
                if (v.topic && v.topic !== "Général") subs[v.topic] = (subs[v.topic] || 0) + 1;
            });

            const catList = document.getElementById("catList");
            catList.innerHTML = `<button class="sidebar-btn active" onclick="filterCat(null, this)">🌐 El Kol <span class="cat-count">${ALL_VIDEOS.length}</span></button>`;
            Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c, n]) => {
                catList.innerHTML += `<button class="sidebar-btn" onclick="filterCat('${c}', this)">📁 ${c} <span class="cat-count">${n}</span></button>`;
            });

            const subList = document.getElementById("subList");
            Object.entries(subs).sort((a,b)=>b[1]-a[1]).slice(0, 15).forEach(([s, n]) => {
                subList.innerHTML += `<button class="sidebar-btn" onclick="filterSub('${s}', this)">📌 ${s} <span class="cat-count">${n}</span></button>`;
            });
        }

        function buildChips() {
            const chips = document.getElementById("chipsList");
            const cats = [...new Set(ALL_VIDEOS.map(v => v.category))];
            chips.innerHTML = `<button class="chip active" onclick="showAll()">El Kol</button>`;
            cats.forEach(c => {
                chips.innerHTML += `<button class="chip" onclick="filterChip('${c}', this)">${c}</button>`;
            });
        }

        function render(list) {
            const grid = document.getElementById("grid");
            if (!list.length) { grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:50px;color:#888'>Ma l9ina 7atta vidéo!</p>"; return; }
            grid.innerHTML = list.map(v => `
                <div class="video-card" onclick="openModal('${v.id}', '${escapeQuotes(v.title)}', '${escapeQuotes(v.channel)}')">
                    <div class="video-thumb">
                        <img src="${v.thumbnail}" alt="" loading="lazy">
                        <span class="topic-badge">${v.topic}</span>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-channel">📺 ${v.channel}</div>
                    </div>
                </div>
            `).join("");
        }

        function escapeQuotes(s) { return (s||"").replace(/'/g, "\\'"); }

        function filterCat(c, btn) {
            currentCat = c; currentSub = null;
            document.querySelectorAll(".sidebar-btn").forEach(b => b.classList.remove("active"));
            if(btn) btn.classList.add("active");
            apply();
        }

        function filterSub(s, btn) {
            currentSub = s;
            document.querySelectorAll("#subList .sidebar-btn").forEach(b => b.classList.remove("active"));
            if(btn) btn.classList.add("active");
            apply();
        }

        function filterChip(c, btn) {
            currentCat = c; currentSub = null;
            document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
            if(btn) btn.classList.add("active");
            apply();
        }

        function searchVideos() {
            searchQ = document.getElementById("searchInput").value.toLowerCase();
            apply();
        }

        function showAll() {
            currentCat = null; currentSub = null; searchQ = "";
            document.getElementById("searchInput").value = "";
            document.querySelectorAll(".sidebar-btn, .chip").forEach(b => b.classList.remove("active"));
            document.querySelector(".chip")?.classList.add("active");
            apply();
        }

        function apply() {
            let res = ALL_VIDEOS;
            if (currentCat) res = res.filter(v => v.category === currentCat);
            if (currentSub) res = res.filter(v => v.topic === currentSub);
            if (searchQ) res = res.filter(v => (v.title+v.channel+v.topic).toLowerCase().includes(searchQ));
            render(res);
        }

        function openModal(id, title, chan) {
            document.getElementById("player").innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
            document.getElementById("mTitle").textContent = title;
            document.getElementById("mChan").textContent = "📺 " + chan;
            document.getElementById("modal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("modal").classList.remove("active");
            document.getElementById("player").innerHTML = "";
        }

        window.onload = init;
    </script>
</body>
</html>
