<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisian YouTube 🇹🇳 - منصة الدروس التونسية</title>
    
    <!-- FAVICON (Logo mel barra) -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <i class="fas fa-bars menu-icon" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="showAll()">
                <img src="logo.png" alt="Logo" class="custom-logo">
                <span class="logo-text">Tunisian<span class="logo-yt">YouTube</span></span>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Lawwej 3la cours... (Photoshop, Python, Anglais, Bac...)" oninput="searchVideos()">
        </div>
        <div class="header-right">
            <span class="flag">🇹🇳</span>
            <span class="video-count" id="videoCount">0 cours</span>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <h3>📚 Categories</h3>
            <div id="categoryList"></div>
        </div>
        <div class="sidebar-section">
            <h3>🎯 Mawadhi3 (Topics)</h3>
            <div id="subCategoryList"></div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <div class="filter-chips" id="filterChips">
            <button class="chip active" onclick="showAll()">El Kol</button>
        </div>

        <div class="active-filters" id="activeFilters"></div>

        <div class="video-grid" id="videoGrid">
            <p style="text-align:center; grid-column:1/-1; padding:50px; font-size:18px;">⏳ 9a3ed nchargi fel coursset...</p>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-search" style="font-size:60px;color:#666; margin-bottom:15px;"></i>
            <h2>Ma l9ina 7atta vidéo!</h2>
            <p>Jarreb kelma okhra fel recherche</p>
        </div>
    </main>

    <!-- VIDEO PLAYER MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="video-player" id="videoPlayer"></div>
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalChannel"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
